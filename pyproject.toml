[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-alignment"
version = "0.1.0"
description = "Scenario-based alignment testing for enterprise GenAI systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "genai-capability-bench @ git+https://github.com/minw0607/genai_capability_bench",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "pytest>=8.0",
]
# multi_agent_otel_eval (adapters/agent_otel.py) isn't pip-installable itself —
# see README Setup for cloning it as a sibling repo — but these are its own
# runtime dependencies, needed regardless of how it's imported.
agentic = [
  "langchain-openai>=0.1.0",
  "langchain-core>=0.2.0",
  "langchain-community>=0.2.0",
  "langgraph>=0.1.0",
  "datasets>=2.19.0",
  "seaborn>=0.13.0",
  "beautifulsoup4>=4.12.0",
  "tiktoken>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "native*", "reporting*", "scenarios*"]

[tool.setuptools.package-data]
reporting = ["templates/*.j2"]
